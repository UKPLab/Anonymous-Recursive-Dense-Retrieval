# Single-hop search x readout under one encoder (Tables 3, 24, 27), recovery instruction, nDCG@10.
# CoIR on the paper's sample: up to 1,000 queries per subsplit (17,901 queries). Realized readouts are
# completed with the root ranking (backfill), as in the paper.
name: singlehop_readouts
prompts: single-hop
suites: [nanobeir, bright, topiocqa, toolret, coir]
query_max_length: 4096
document_max_length: 8192
query_sample: {coir: 1000}
query_sample_seed: 20260924   # the paper's seeded CoIR sample (17,901 queries)
runs:
  - name: tree
    search: {name: tree, depth: 4, branching: 3, dedup: none}
    readouts:
      root: root
      global: global
      path_product: {name: path_product, backfill_root: true}
      mdr: {name: sequence_sum, backfill_root: true}
      selected: {name: global, restrict_to_selected: true, backfill_root: true}
  - name: chain
    search: {name: chain, depth: 4, dedup: none}
    readouts:
      global: global
      terminal: terminal
      interp_0.8: {name: root_interpolation, lam: 0.8}     # as in DC-PRF
      interp_0.5: {name: root_interpolation, lam: 0.5}
      interp_0.2: {name: root_interpolation, lam: 0.2}
  - name: feedback
    search: {name: joint_feedback, m: 3}                   # as in ANCE-PRF
    readouts: {state: {name: state, level: 2}}
  - name: beam5
    search: {name: beam, width: 5, depth: 4}
    readouts:
      beamdr: {name: probability_chain, backfill_root: true}
      mdr: {name: sequence_sum, backfill_root: true}
  - name: beam13
    search: {name: beam, width: 13, depth: 4}
    readouts:
      global: global
      path_product: {name: path_product, backfill_root: true}
      beamdr: {name: probability_chain, backfill_root: true}
      mdr: {name: sequence_sum, backfill_root: true}
  - name: doc_as_query
    search: {name: doc_as_query, depth: 4, branching: 3, dedup: none}
    readouts: {global: global, cor: rrf_postorder}
expected:
