  chain/interp_0.5:    {musique: 64.91, browsecomp: 20.77, fanoutqa: 31.29, frames: 64.38, mean: 45.34, source: "Table 30"}
  chain/interp_0.2:    {musique: 48.86, browsecomp: 19.58, fanoutqa: 29.91, frames: 53.09, mean: 37.86, source: "Table 30"}
