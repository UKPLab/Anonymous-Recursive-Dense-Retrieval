# Multi-hop inference forms of prior work with RDR's encoder (Tables 3a/3b, 15, 30, 32, 33), Recall@5.
name: multihop_inference_forms
prompts: multi-hop
suites: [musique, browsecomp, fanoutqa, frames]
query_max_length: 4096
document_max_length: 512
runs:
  - name: chain
    search: {name: chain, depth: 4}
    readouts:
      global: global
      terminal: terminal
      interp_0.8: {name: root_interpolation, lam: 0.8}    # as in DC-PRF
      interp_0.5: {name: root_interpolation, lam: 0.5}
      interp_0.2: {name: root_interpolation, lam: 0.2}
  - name: feedback
    search: {name: joint_feedback, m: 3}                  # as in ANCE-PRF
    readouts:
      state: {name: state, level: 2}
  - name: beam5
    search: {name: beam, width: 5, depth: 4}
    readouts: {global: global, path_product: path_product, beamdr: probability_chain, mdr: sequence_sum}
  - name: beam10
    search: {name: beam, width: 10, depth: 4}
    readouts: {global: global}
  - name: beam13
    search: {name: beam, width: 13, depth: 4}
    readouts: {global: global, path_product: path_product, beamdr: probability_chain, mdr: sequence_sum}
  - name: doc_as_query
    search: {name: doc_as_query, depth: 4, branching: 3}
    readouts: {global: global, cor: rrf_postorder}        # cor: as in COR
  - name: breadth12
    search: {name: breadth, width: 12}
    readouts: {global: global}
  - name: breadth39
    search: {name: breadth, width: 39}
    readouts: {global: global}
